# Enable Nix v2 interface.
experimental-features = flakes nix-command
warn-dirty = false
# GitHub limits unauthenticated API calls per IP. Corporate egress IPs
# often reach this limit. access-tokens.conf is a symlink to
# private-dotfiles/nix-access-tokens.conf, which contains:
#   access-tokens = github.com=<token>
# Nix ignores the include when private-dotfiles is not present.
!include access-tokens.conf
